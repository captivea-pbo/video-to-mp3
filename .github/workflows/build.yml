name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: dist/*.exe
            script: build:win
          - os: macos-latest
            name: macOS
            artifact: dist/*.dmg
            script: build:mac
          - os: ubuntu-latest
            name: Linux
            artifact: dist/*.AppImage
            script: build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-to-MP3-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          retention-days: 30
